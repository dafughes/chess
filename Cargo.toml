[package]
name = "chess"
version = "0.1.0"
edition = "2021"

[lib]
name = "chess"
path = "src/lib.rs"

[[bin]]
name = "engine"
path = "src/main.rs"



[profile.test]
opt-level = 3
debug = true
debug-assertions = true
codegen-units = 4

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
strip = true

